version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/api-gateway", "/movies-service", "/proto", "/shared"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/api-gateway", "/movies-service"]
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/tofu
    schedule:
      interval: weekly
