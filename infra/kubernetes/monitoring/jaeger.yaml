# Jaeger all-in-one — same trade-off as docker-compose.yml's jaeger
# service: in-memory storage, traces don't survive a pod restart. Fine
# for local study use; see docs/adr/0007-*.md for the production
# alternative (a real trace storage backend).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: re-api-books-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.65.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686 # UI
            - containerPort: 4317 # OTLP gRPC receiver
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-service
  namespace: re-api-books-dev
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
