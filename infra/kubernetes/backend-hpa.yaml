# Requires the metrics-server addon in the cluster (kind: `kind` doesn't
# ship it by default — see infra/kubernetes/README.md for how to add it).
# Without metrics-server these HPAs exist but never scale anything; they
# don't error, they just sit at minReplicas forever.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: re-api-books-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: movies-service-hpa
  namespace: re-api-books-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: movies-service-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
