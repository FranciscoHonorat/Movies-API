{{- if .Values.apiGateway.enabled }}
{{- $name := include "movies-api.name" (list . "api-gateway") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "movies-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  {{- if not .Values.apiGateway.autoscaling.enabled }}
  replicas: {{ .Values.apiGateway.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "movies-api.selector" (list . "api-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "movies-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: api-gateway
      annotations:
        # reinicia os pods quando config/secret mudam
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.apiGateway.port | quote }}
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api-gateway
          image: {{ include "movies-api.image" (list . .Values.apiGateway.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.apiGateway.port }}
          envFrom:
            - configMapRef:
                name: {{ include "movies-api.fullname" . }}-config
            - secretRef:
                name: {{ include "movies-api.fullname" . }}-secrets
          env:
            - name: HERMES_SERVICE_NAME
              value: api-gateway
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "movies-api.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "movies-api.selector" (list . "api-gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.apiGateway.port }}
      targetPort: http
{{- if .Values.apiGateway.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "movies-api.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .Values.apiGateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.apiGateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.apiGateway.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
