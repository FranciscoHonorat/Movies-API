{{- $mongoPass := required "mongodb.rootPassword é obrigatório" .Values.mongodb.rootPassword -}}
{{- $rabbitPass := required "rabbitmq.password é obrigatório" .Values.rabbitmq.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "movies-api.fullname" . }}-secrets
  labels:
    {{- include "movies-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_ROOT_USER: {{ .Values.mongodb.rootUser | quote }}
  MONGO_ROOT_PASSWORD: {{ $mongoPass | quote }}
  MONGO_URI: {{ printf "mongodb://%s:%s@%s:%v/%s?authSource=admin" .Values.mongodb.rootUser ($mongoPass | urlquery) (include "movies-api.name" (list . "mongodb")) .Values.mongodb.port .Values.mongodb.database | quote }}
  RABBITMQ_USER: {{ .Values.rabbitmq.user | quote }}
  RABBITMQ_PASSWORD: {{ $rabbitPass | quote }}
  RABBITMQ_URI: {{ printf "amqp://%s:%s@%s:%v/" .Values.rabbitmq.user ($rabbitPass | urlquery) (include "movies-api.name" (list . "rabbitmq")) .Values.rabbitmq.port | quote }}
  HERMES_API_KEY: {{ .Values.hermes.apiKey | quote }}
