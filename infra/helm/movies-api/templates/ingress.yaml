{{- if and .Values.ingress.enabled .Values.apiGateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "movies-api.fullname" . }}
  labels:
    {{- include "movies-api.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "movies-api.name" (list . "api-gateway") }}
                port:
                  name: http
{{- end }}
